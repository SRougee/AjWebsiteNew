name: Format website source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-website
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Format website files
        run: |
          npx --yes prettier@3 --write \
            "index.html" \
            "about.html" \
            "reviews.html" \
            "privacy-policy.html" \
            "terms-and-conditions.html" \
            "sitemap.html" \
            "services/*.html" \
            "industries/*.html" \
            "areas/*.html" \
            "css/*.css" \
            "*.js" \
            "sitemap.xml"

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html reviews.html privacy-policy.html terms-and-conditions.html sitemap.html services industries areas css '*.js' sitemap.xml
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
          else
            git commit -m "Format website source files"
            git push
          fi
