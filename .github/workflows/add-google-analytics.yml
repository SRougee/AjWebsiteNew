name: Add Google Analytics 4

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add Google Analytics 4 to index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          measurement_id = "G-EV2E8FYEG5"
          marker = "<!-- Google tag (gtag.js) -->"

          if marker not in html:
              snippet = f'''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id={measurement_id}"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){{dataLayer.push(arguments);}}
            gtag('js', new Date());
            gtag('config', '{measurement_id}');
          </script>
          '''
              if "</head>" not in html:
                  raise SystemExit("Could not find </head> in index.html")
              html = html.replace("</head>", snippet + "</head>", 1)
              path.write_text(html, encoding="utf-8")
          else:
              print("Google Analytics is already present; no changes needed.")

      - name: Commit Google Analytics change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "No index.html changes to commit."
          else
            git add index.html
            git commit -m "Add Google Analytics 4 tracking"
            git push
          fi
