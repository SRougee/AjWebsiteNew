name: Sync contact form from live site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-form:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect live contact form source
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import Request, urlopen
          import re

          live_url = "https://ajaccounting.co.za/"
          req = Request(live_url, headers={"User-Agent": "Mozilla/5.0"})
          with urlopen(req, timeout=30) as response:
              live_html = response.read().decode("utf-8", errors="replace")

          print("Live page length:", len(live_html))
          print("Contains <form>:", bool(re.search(r"<form\b", live_html, flags=re.I)))
          for term in ("formspree", "mailto:", "xwvjoqzy", "contactForm"):
              print(f"Contains {term!r}:", term.lower() in live_html.lower())

          form_match = re.search(r"<form\b[^>]*id=[\"']contactForm[\"'][^>]*>.*?</form>", live_html, flags=re.I | re.S)
          if not form_match:
              raise SystemExit("Could not find the live contact form with id=contactForm.")

          print("===== LIVE CONTACT FORM =====")
          print(form_match.group(0))
          print("===== END LIVE CONTACT FORM =====")

          marker = "// ── Contact form submission"
          idx = live_html.find(marker)
          if idx < 0:
              raise SystemExit("Could not find the live contact-form submission JavaScript.")

          print("===== LIVE CONTACT FORM JAVASCRIPT =====")
          print(live_html[idx:idx + 12000])
          print("===== END LIVE CONTACT FORM JAVASCRIPT =====")

          # Correct extraction is ready for the next step once the exact JS block is reviewed.

      - name: Commit synced form
        shell: bash
        run: |
          echo "Diagnostic only: no repository files are changed until the live form source is confirmed."
