name: Fix site navigation and asset paths
on:
  push:
    paths:
      - 'site-fix-trigger.txt'
    branches: [main]
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch generator, CSS and generated pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. Fix the stylesheet path to the hero image.
          css = Path('css/style.css')
          text = css.read_text(encoding='utf-8')
          text = text.replace("url('./Images/heroBackGround.avif')", "url('../Images/heroBackGround.avif')")

          # Add desktop dropdown and mobile navigation styling once.
          if '.nav-dropdown{' not in text:
              extra = r'''

/* Expanded navigation */
.nav-dropdown{position:relative;display:flex;align-items:center;height:100%}
.nav-dropdown-toggle{display:flex;align-items:center;gap:6px}
.nav-dropdown-toggle span{font-size:.7rem;transition:transform .2s ease}
.nav-dropdown:hover .nav-dropdown-toggle span,.nav-dropdown:focus-within .nav-dropdown-toggle span{transform:rotate(180deg)}
.nav-dropdown-menu{position:absolute;top:calc(100% + 12px);left:50%;transform:translate(-50%,8px);min-width:245px;padding:10px;background:var(--white);border:1px solid rgba(20,44,122,.08);border-radius:12px;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility .18s ease;z-index:1100}
.nav-dropdown-menu::before{content:'';position:absolute;top:-7px;left:50%;width:14px;height:14px;background:var(--white);border-left:1px solid rgba(20,44,122,.08);border-top:1px solid rgba(20,44,122,.08);transform:translateX(-50%) rotate(45deg)}
.nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0)}
.nav-dropdown-menu a{display:block!important;padding:10px 12px;border-radius:8px;font-size:.88rem!important;font-weight:600!important;white-space:nowrap}
.nav-dropdown-menu a:hover,.nav-dropdown-menu a:focus{background:var(--grey-050);color:var(--navy)}
.mobile-menu .mobile-section-label{color:rgba(255,255,255,.62);font-family:var(--font-body);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:18px 0 4px;border-bottom:0}
.mobile-menu nav a.mobile-sub{font-family:var(--font-body);font-size:1.02rem;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
@media(max-width:799px){.nav-links,.nav-cta{display:none!important}.nav-inner{padding:10px 18px}.logo{font-size:1.2rem}.mobile-menu{overflow-y:auto}.mobile-menu nav{margin-top:28px}.mobile-menu .mobile-section-label{padding-top:12px}}
@media(min-width:800px){.hamburger{display:none}}
'''
              text += extra
          css.write_text(text, encoding='utf-8')

          wf = Path('.github/workflows/build-site.yml')
          s = wf.read_text(encoding='utf-8')

          # Replace the old simple navbar template with a real dropdown navbar.
          old_nav = '''nav='''<header class="site-nav"><div class="nav-inner"><a href="{home}" class="logo"><span class="mark">AJ</span> AJ Accounting &amp; Tax</a><nav class="nav-links"><a href="{home}#about">About</a><a href="{home}#services">Services</a><a href="{home}#industries">Industries</a><a href="{home}#alwin">Meet Alwin</a><a href="{home}#testimonials">Reviews</a><a href="{home}#contact">Contact</a></nav><a href="{home}#contact" class="btn btn-navy nav-cta">Free Consultation</a></div></header>'''
          new_nav = '''nav='''<header class="site-nav"><div class="nav-inner"><a href="{home}" class="logo"><span class="mark">AJ</span> AJ Accounting &amp; Tax</a><nav class="nav-links"><a href="{home}#about">About</a><div class="nav-dropdown"><a href="{home}#services" class="nav-dropdown-toggle">Services <span>▾</span></a><div class="nav-dropdown-menu"><a href="{home}services/personal-tax.html">Personal Tax</a><a href="{home}services/business-accounting.html">Business Accounting</a><a href="{home}services/vat.html">VAT</a><a href="{home}services/payroll.html">Payroll</a><a href="{home}services/sars-disputes.html">SARS Queries &amp; Disputes</a><a href="{home}services/financial-statements.html">Financial Statements</a><a href="{home}services/cipc-services.html">CIPC &amp; Tax Clearance</a></div></div><div class="nav-dropdown"><a href="{home}#industries" class="nav-dropdown-toggle">Industries <span>▾</span></a><div class="nav-dropdown-menu"><a href="{home}industries/restaurants-hospitality.html">Restaurants &amp; Hospitality</a><a href="{home}industries/manufacturing.html">Manufacturing</a><a href="{home}industries/precious-metals.html">Gold Vendors &amp; Precious Metals</a><a href="{home}industries/trailer-manufacturing.html">Trailer Manufacturing</a><a href="{home}industries/small-business.html">Small &amp; Medium Businesses</a><a href="{home}industries/individuals-families.html">Individuals &amp; Families</a></div></div><a href="{home}#alwin">Meet Alwin</a><a href="{home}#testimonials">Reviews</a><a href="{home}#contact">Contact</a></nav><a href="{home}#contact" class="btn btn-navy nav-cta">Free Consultation</a><button class="hamburger" type="button" aria-label="Open menu"><span></span><span></span><span></span></button></div></header>'''
          if old_nav in s:
              s = s.replace(old_nav, new_nav)

          # Correct generated interior-page Explore links by using the full folder path.
          s = s.replace("rel={x[0]:x[1] for x in [('personal-tax.html','Personal Tax'),('business-accounting.html','Business Accounting'),('vat.html','VAT'),('payroll.html','Payroll')]}", "rel={x:v for x,v in [('services/personal-tax.html','Personal Tax'),('services/business-accounting.html','Business Accounting'),('services/vat.html','VAT'),('services/payroll.html','Payroll')]}")
          s = s.replace("rel={f'{x}.html':v[0] for x,v in industries.items() if x!=slug}", "rel={f'industries/{x}.html':v[0] for x,v in industries.items() if x!=slug}")
          s = s.replace("rel={f'{x}.html':v[0] for x,v in areas.items() if x!=slug}", "rel={f'areas/{x}.html':v[0] for x,v in areas.items() if x!=slug}")

          # Make related-link generation use the supplied path directly.
          s = s.replace("links=''.join(f'<li><a href=\"{prefix}{x}\">{related[x]}</a></li>' for x in related)", "links=''.join(f'<li><a href=\"{prefix}{x}\">{related[x]}</a></li>' for x in related)")

          # Replace the mobile menu in the homepage if the existing mobile menu is present.
          # The generator preserves the homepage's own menu; add a compact expanded menu immediately after its nav.
          idx = Path('index.html')
          home_html = idx.read_text(encoding='utf-8')
          if 'services/personal-tax.html' not in home_html:
              marker = '</nav>'
              pos = home_html.find(marker, home_html.find('class="mobile-menu"'))
              if pos != -1:
                  insert = '''<div class="mobile-expanded-links"><div class="mobile-section-label">Services</div><nav><a class="mobile-sub" href="./services/personal-tax.html">Personal Tax</a><a class="mobile-sub" href="./services/business-accounting.html">Business Accounting</a><a class="mobile-sub" href="./services/vat.html">VAT</a><a class="mobile-sub" href="./services/payroll.html">Payroll</a><a class="mobile-sub" href="./services/sars-disputes.html">SARS Queries &amp; Disputes</a><a class="mobile-sub" href="./services/financial-statements.html">Financial Statements</a><a class="mobile-sub" href="./services/cipc-services.html">CIPC &amp; Tax Clearance</a><div class="mobile-section-label">Industries</div><a class="mobile-sub" href="./industries/restaurants-hospitality.html">Restaurants &amp; Hospitality</a><a class="mobile-sub" href="./industries/manufacturing.html">Manufacturing</a><a class="mobile-sub" href="./industries/precious-metals.html">Gold Vendors &amp; Precious Metals</a><a class="mobile-sub" href="./industries/trailer-manufacturing.html">Trailer Manufacturing</a><a class="mobile-sub" href="./industries/small-business.html">Small &amp; Medium Businesses</a><a class="mobile-sub" href="./industries/individuals-families.html">Individuals &amp; Families</a></nav></div>'''
                  home_html = home_html[:pos+len(marker)] + insert + home_html[pos+len(marker):]
                  idx.write_text(home_html, encoding='utf-8')

          wf.write_text(s, encoding='utf-8')
          PY

          # Remove the one-time trigger so this workflow cannot loop.
          rm -f site-fix-trigger.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Fix expanded navigation and hero background"
          git push
