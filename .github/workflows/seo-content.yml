          <h2 style="margin-top:30px">What is an ITR12?</h2>
          <p>An ITR12 is the South African income tax return used by individual taxpayers to declare income and relevant deductions to SARS. Depending on your circumstances, information may include employment income, investment income, retirement-related amounts, medical expenses, donations, travel or other allowable items.</p>
          <p>The correct information and supporting documentation matter. An incomplete or incorrect return can result in unnecessary queries, delays or an incorrect assessment.</p>
