name: Enrich AJ Accounting site content
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  content:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add reader-focused SEO content
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          pages = {
          'services/personal-tax.html': {'title':'Personal Income Tax Returns','description':'Personal income tax and ITR12 return assistance from a registered tax practitioner in Germiston, serving clients across the East Rand.','body':'''<h2>Personal Income Tax Returns in Germiston</h2><p>Preparing a personal income tax return should not mean trying to interpret every SARS requirement on your own. AJ Accounting &amp; Tax provides practical assistance with individual income tax returns, helping clients organise relevant information, understand their tax position and submit accurate returns.</p><p>Based in Elspark, Germiston, the practice assists individuals and families in Germiston, Boksburg, Benoni, Brakpan, Springs and surrounding East Rand areas. Clients deal directly with a professional tax practitioner rather than a call centre.</p><h2 style="margin-top:30px">What is an ITR12?</h2><p>An ITR12 is the South African income tax return used by individual taxpayers to declare income and relevant deductions to SARS. Depending on your circumstances, information may include employment income, investment income, retirement-related amounts, medical expenses, donations, travel or other allowable items.</p><h2 style="margin-top:30px">How AJ Accounting &amp; Tax can help</h2><ul><li>Preparation and submission of individual income tax returns</li><li>Review of income and relevant supporting documentation</li><li>Assistance with allowable deductions and tax information</li><li>Provisional tax support where applicable</li><li>Help responding to SARS queries relating to a return</li><li>Practical explanation of your assessment and next steps</li></ul><h2 style="margin-top:30px">Who may benefit?</h2><p>Professional assistance can be useful if you have more than one source of income, investment or rental income, commission or variable earnings, or if your return has been selected for verification. It can also provide confidence that your annual tax affairs have been prepared carefully.</p>'''} ,
          'services/business-accounting.html': {'title':'Business Accounting','description':'Small business accounting, bookkeeping and financial reporting in Germiston and the East Rand, with practical support for owner-managed businesses.','body':'''<h2>Practical Business Accounting for Small and Medium Businesses</h2><p>Good accounting gives a business owner more than a set of numbers. It provides a clearer picture of what the business owns, owes, earns and spends. AJ Accounting &amp; Tax provides bookkeeping and accounting support for small and medium businesses that want reliable financial information and personal service.</p><h2 style="margin-top:30px">Bookkeeping and monthly accounts</h2><p>Accurate bookkeeping is the foundation of useful financial reporting. Regular accounting support can help owners keep track of income, expenses, debtors, creditors, cash flow and the overall financial position of the business.</p><h2 style="margin-top:30px">Business accounting services</h2><ul><li>Bookkeeping and maintenance of accounting records</li><li>Monthly accounting and financial reporting</li><li>Management information for business owners</li><li>Year-end accounting support</li><li>Company income tax and provisional tax support</li><li>VAT and payroll coordination where required</li><li>Practical accounting guidance</li></ul><h2 style="margin-top:30px">Why regular accounting matters</h2><p>Waiting until year-end can make it difficult to spot declining margins, rising costs or cash-flow pressure. Regular financial information gives owners an opportunity to make decisions using current information.</p>'''} ,
          'services/vat.html': {'title':'VAT Services','description':'VAT registration, VAT201 return preparation and VAT compliance support for businesses in Germiston and across the East Rand.','body':'''<h2>VAT Services for South African Businesses</h2><p>VAT affects pricing, cash flow, record keeping and the way a business deals with SARS. Getting VAT right requires more than submitting a return on time: the underlying records and transactions need to support the figures declared.</p><h2 style="margin-top:30px">VAT registration and administration</h2><p>Businesses that meet the applicable requirements may need to register for VAT. AJ Accounting &amp; Tax assists with practical VAT administration so owners can focus on running the business.</p><h2 style="margin-top:30px">VAT201 returns</h2><p>A VAT201 return reports VAT charged and VAT that may be claimed on qualifying business expenses and purchases. Supporting records are important because SARS can request information to verify a VAT declaration.</p><ul><li>VAT registration support</li><li>VAT201 return preparation and submission</li><li>Review of VAT records and transactions</li><li>Assistance with VAT-related SARS queries</li><li>Practical VAT compliance guidance</li></ul><h2 style="margin-top:30px">Avoiding common VAT problems</h2><p>Incomplete invoices, inconsistent records and incorrect treatment of transactions can create problems. Regular review of records helps identify issues earlier.</p>'''} ,
          'services/payroll.html': {'title':'Payroll & EMP201','description':'Payroll administration and EMP201 submission support for small and medium businesses in Germiston and the East Rand.','body':'''<h2>Payroll Services and EMP201 Support</h2><p>Payroll needs to be accurate, consistent and handled on time. Employees rely on correct pay and payslips, while employers have ongoing responsibilities relating to employee tax and payroll administration.</p><h2 style="margin-top:30px">What payroll support can include</h2><ul><li>Payroll processing and administration support</li><li>Employee earnings and deduction calculations</li><li>Payslip and payroll record support</li><li>EMP201 preparation and submission</li><li>Employee tax administration</li><li>Assistance with payroll-related queries</li></ul><h2 style="margin-top:30px">Why payroll accuracy matters</h2><p>Payroll errors can affect employees, employer submissions and year-end information. Regular checking of payroll calculations and records can help identify discrepancies before they become more difficult to correct.</p><h2 style="margin-top:30px">Payroll for growing businesses</h2><p>Professional payroll support gives owners more time to focus on operations while maintaining better control over payroll information and monthly submissions.</p>'''} ,
          'services/sars-disputes.html': {'title':'SARS Queries & Disputes','description':'Professional assistance with SARS queries, verifications, objections and tax disputes for individuals and businesses in Gauteng.','body':'''<h2>Help With SARS Queries, Verifications and Disputes</h2><p>Receiving a SARS notification can be stressful, particularly when you are unsure what information is required or disagree with an assessment. AJ Accounting &amp; Tax assists individuals and businesses with SARS correspondence, verification requests and tax matters requiring a considered response.</p><h2 style="margin-top:30px">SARS verification assistance</h2><p>A SARS verification may require supporting documents or clarification of information declared on a tax return. A clear and properly organised response can help avoid unnecessary delays.</p><h2 style="margin-top:30px">When you disagree with SARS</h2><p>Where a taxpayer believes an assessment is incorrect, formal processes may be available to challenge it. The appropriate response depends on the circumstances and the nature of the assessment or decision.</p><ul><li>SARS correspondence and query assistance</li><li>Verification and supporting-document assistance</li><li>Review of tax information and assessments</li><li>Objection and dispute preparation where appropriate</li><li>Practical guidance on next steps</li></ul><h2 style="margin-top:30px">Do not ignore SARS correspondence</h2><p>Tax correspondence can contain important dates and requests for information. Early professional assistance can help you understand what needs to be done.</p>'''} ,
          'services/financial-statements.html': {'title':'Financial Statements','description':'Professional financial statement preparation and year-end accounting support for businesses in Germiston and the East Rand.','body':'''<h2>Financial Statements for Businesses</h2><p>Financial statements turn accounting records into a structured view of a business's financial performance and position. They help owners, managers and other stakeholders understand how the business is performing.</p><h2 style="margin-top:30px">What financial statements can tell you</h2><p>Depending on the reporting requirements and nature of the business, financial statements can provide information about revenue, expenses, profitability, assets, liabilities and the overall financial position.</p><h2 style="margin-top:30px">Our financial statement support</h2><ul><li>Preparation of financial statements</li><li>Year-end accounting assistance</li><li>Review and organisation of accounting records</li><li>Financial information for management and stakeholders</li><li>Practical accounting assistance</li></ul><h2 style="margin-top:30px">Useful information, not just compliance</h2><p>Financial statements can help a business owner identify trends, understand margins and assess the financial consequences of business decisions.</p>'''} ,
          'services/cipc-services.html': {'title':'CIPC & Tax Clearance','description':'CIPC company administration, annual return and tax clearance assistance for businesses in Germiston and the East Rand.','body':'''<h2>CIPC and Tax Clearance Assistance</h2><p>Company administration is easy to overlook when an owner is focused on running the business. Keeping CIPC information current and maintaining good tax compliance is important for ongoing administration.</p><h2 style="margin-top:30px">CIPC services</h2><ul><li>Company registration support</li><li>CIPC annual return administration</li><li>Company information and compliance assistance</li><li>Practical guidance on CIPC requirements</li></ul><h2 style="margin-top:30px">Tax clearance assistance</h2><p>A tax compliance status or tax clearance requirement may arise when a business is tendering, entering into a contract or needing to demonstrate that its tax affairs are in order. The underlying SARS compliance position may need attention first.</p><h2 style="margin-top:30px">Keep business administration under control</h2><p>Good company administration works alongside good accounting. Keeping CIPC, tax and accounting matters organised reduces the risk of discovering an administrative problem when a document is urgently needed.</p>'''} ,
          'industries/restaurants-hospitality.html': {'title':'Restaurants & Hospitality','description':'Accounting and tax support for restaurants and hospitality businesses in Germiston and the East Rand, including VAT, payroll and bookkeeping.','body':'''<h2>Accounting for Restaurants and Hospitality Businesses</h2><p>Restaurants, cafés, catering businesses and hospitality operations face high transaction volumes, stock, staff costs, VAT, supplier payments and often tight margins. AJ Accounting &amp; Tax provides practical accounting and tax support for hospitality owners.</p><h2 style="margin-top:30px">Areas that deserve attention</h2><ul><li>Daily sales and transaction records</li><li>Food and beverage costs and supplier accounts</li><li>VAT and supporting documentation</li><li>Payroll and employee records</li><li>Monthly bookkeeping and financial reporting</li><li>Cash-flow and expense control</li></ul><h2 style="margin-top:30px">Why regular accounting helps</h2><p>Small changes in food costs, wages or overheads can affect profitability. Regular financial information gives owners a better opportunity to identify changes and act on them.</p>'''} ,
          'industries/manufacturing.html': {'title':'Manufacturing','description':'Accounting, bookkeeping, VAT, payroll and financial reporting support for manufacturing businesses in Germiston and the East Rand.','body':'''<h2>Accounting Support for Manufacturing Businesses</h2><p>Manufacturing businesses need financial information that reflects materials, production costs, stock, labour, overheads and sales. AJ Accounting &amp; Tax provides accounting support for manufacturers who need organised records and practical financial information.</p><h2 style="margin-top:30px">Manufacturing accounting considerations</h2><ul><li>Bookkeeping and monthly accounts</li><li>Stock and inventory records</li><li>Cost and expense monitoring</li><li>VAT administration and returns</li><li>Payroll and employer submissions</li><li>Financial statements and year-end support</li></ul><h2 style="margin-top:30px">Better information for better decisions</h2><p>Reliable accounting can help an owner see where costs are increasing, whether margins are changing and how operational decisions affect the financial position of the business.</p>'''} ,
          'industries/precious-metals.html': {'title':'Gold Vendors & Precious Metals','description':'Accounting and tax support for gold vendors and precious metals businesses, with careful attention to records, transactions and compliance.','body':'''<h2>Accounting for Gold Vendors and Precious Metals Businesses</h2><p>Businesses involved in gold and precious metals require careful financial record keeping because transactions can be high in value and documentation is particularly important. AJ Accounting &amp; Tax provides professional accounting and tax support with an emphasis on accurate records and practical compliance.</p><h2 style="margin-top:30px">Areas of accounting support</h2><ul><li>Bookkeeping and transaction records</li><li>VAT and tax administration</li><li>Monthly financial information</li><li>Payroll support where applicable</li><li>Financial statements and year-end accounting</li><li>SARS accounting and tax query assistance</li></ul><h2 style="margin-top:30px">Accuracy and documentation</h2><p>Where transactions are valuable or complex, supporting documentation and consistent accounting treatment become especially important. A well-organised process helps the business respond confidently when information is required.</p>'''} ,
          'industries/trailer-manufacturing.html': {'title':'Trailer Manufacturing','description':'Accounting and tax services for trailer manufacturers in Germiston and the East Rand, including bookkeeping, VAT, payroll and financial reporting.','body':'''<h2>Accounting for Trailer Manufacturing Businesses</h2><p>Trailer manufacturing combines production, materials, labour, supplier accounts and customer sales. Keeping those elements organised helps an owner understand profitability and manage cash flow.</p><h2 style="margin-top:30px">Support for the accounting cycle</h2><ul><li>Bookkeeping and monthly accounts</li><li>Supplier and expense records</li><li>Stock and production-related accounting information</li><li>VAT201 preparation and support</li><li>Payroll and EMP201 administration</li><li>Year-end financial statements</li></ul><h2 style="margin-top:30px">Practical financial information</h2><p>Manufacturers need to know whether prices adequately cover materials, labour and overheads. Regular accounting information can provide a clearer basis for reviewing margins and planning.</p>'''} ,
          'industries/small-business.html': {'title':'Small & Medium Businesses','description':'Personalised accounting, bookkeeping, tax, VAT and payroll services for small and medium businesses in Germiston and the East Rand.','body':'''<h2>Accounting for Small and Medium Businesses</h2><p>Small business owners wear many hats. Sales, customers, staff and suppliers usually come before accounting administration, but reliable financial records are essential to understanding performance. AJ Accounting &amp; Tax provides straightforward accounting and tax support with direct communication.</p><h2 style="margin-top:30px">Services that support growing businesses</h2><ul><li>Bookkeeping and monthly accounts</li><li>Company tax and provisional tax support</li><li>VAT returns and administration</li><li>Payroll and EMP201 submissions</li><li>Financial statements</li><li>CIPC and tax clearance assistance</li><li>SARS queries and disputes</li></ul><h2 style="margin-top:30px">An accountant who knows your business</h2><p>A smaller business often benefits from having an accounting professional who understands the business rather than simply processing transactions. Direct service makes it easier to discuss concerns and plan the next step.</p>'''} ,
          'industries/individuals-families.html': {'title':'Individuals & Families','description':'Personal tax and accounting support for individuals and families in Germiston, Boksburg, Benoni and the East Rand.','body':'''<h2>Personal Tax Support for Individuals and Families</h2><p>Personal tax can become complicated when income, investments, deductions or other financial circumstances change. AJ Accounting &amp; Tax offers personal assistance to individuals and families who want their tax affairs handled accurately and professionally.</p><h2 style="margin-top:30px">Personal tax services</h2><ul><li>ITR12 individual income tax returns</li><li>Review of relevant tax information and documents</li><li>Provisional tax support where applicable</li><li>Assistance with SARS queries</li><li>Practical guidance on tax assessments</li></ul><h2 style="margin-top:30px">Personal attention matters</h2><p>Tax questions are often specific to an individual's circumstances. AJ Accounting &amp; Tax is a local practice where clients can communicate directly and receive practical explanations.</p>'''} ,
          'areas/germiston.html': {'title':'Accountant in Germiston','description':'AJ Accounting & Tax is a local accounting and tax practice in Elspark, Germiston, providing personal and business accounting services across Germiston.','body':'''<h2>Local Accounting and Tax Services in Germiston</h2><p>AJ Accounting &amp; Tax is based in Elspark, Germiston and provides professional accounting, bookkeeping and tax services to individuals and businesses in the area. The practice offers direct, personal service with an emphasis on accurate work and practical advice.</p><h2 style="margin-top:30px">Services available in Germiston</h2><ul><li>Personal income tax returns</li><li>Business accounting and bookkeeping</li><li>VAT returns and administration</li><li>Payroll and EMP201 submissions</li><li>Financial statements</li><li>CIPC and tax clearance assistance</li><li>SARS queries and disputes</li></ul><h2 style="margin-top:30px">Serving Elspark and surrounding areas</h2><p>The practice serves Germiston and nearby East Rand communities, while also assisting clients remotely across Gauteng where appropriate.</p>'''} ,
          'areas/boksburg.html': {'title':'Accountant in Boksburg','description':'Accounting, tax, bookkeeping, VAT and payroll services for individuals and businesses in Boksburg and the surrounding East Rand.','body':'''<h2>Accounting and Tax Services for Boksburg</h2><p>AJ Accounting &amp; Tax provides accounting and tax support to individuals and businesses in Boksburg and surrounding East Rand areas. The practice is based in nearby Elspark, Germiston and offers personal professional assistance.</p><h2 style="margin-top:30px">For individuals</h2><p>Individuals can receive assistance with ITR12 personal income tax returns, relevant documentation and SARS queries.</p><h2 style="margin-top:30px">For businesses</h2><ul><li>Bookkeeping and monthly accounts</li><li>VAT201 returns</li><li>Payroll and EMP201 submissions</li><li>Company tax support</li><li>Financial statements</li><li>CIPC and tax clearance assistance</li><li>SARS queries and disputes</li></ul><p>Clients in Boksburg benefit from a local practice that values direct communication and practical accounting advice.</p>'''} ,
          'areas/benoni.html': {'title':'Accountant in Benoni','description':'Accounting, tax, payroll, VAT and SARS support for individuals and businesses in Benoni and surrounding East Rand areas.','body':'''<h2>Accounting and Tax Services for Benoni</h2><p>AJ Accounting &amp; Tax assists clients in Benoni with personal tax, business accounting and related compliance services. From annual tax returns to monthly accounting for a growing business, the focus is accurate work and personal service.</p><h2 style="margin-top:30px">Services for Benoni clients</h2><ul><li>Personal income tax returns</li><li>Bookkeeping and monthly accounting</li><li>VAT registration support and VAT201 returns</li><li>Payroll and EMP201 submissions</li><li>Financial statements</li><li>CIPC and tax clearance assistance</li><li>SARS queries and disputes</li></ul><h2 style="margin-top:30px">Personal service from a nearby practice</h2><p>The practice is based in Elspark, Germiston and serves Benoni and other East Rand communities. Clients can contact AJ Accounting &amp; Tax directly to discuss their requirements.</p>'''} ,
          'areas/east-rand.html': {'title':'Accountant Serving the East Rand','description':'Accounting and tax services across the East Rand, including Germiston, Boksburg, Benoni, Brakpan and Springs.','body':'''<h2>Accounting Services Across the East Rand</h2><p>AJ Accounting &amp; Tax serves individuals and businesses throughout the East Rand from its practice in Elspark, Germiston. Areas served include Germiston, Boksburg, Benoni, Brakpan, Springs and surrounding communities.</p><p>The practice provides a broad range of accounting and tax services while maintaining a personal approach.</p><h2 style="margin-top:30px">East Rand accounting services</h2><ul><li>Personal income tax returns</li><li>Business accounting and bookkeeping</li><li>VAT and VAT201 returns</li><li>Payroll and EMP201 submissions</li><li>Financial statements</li><li>CIPC and tax clearance</li><li>SARS queries and disputes</li></ul><h2 style="margin-top:30px">A local practice with professional experience</h2><p>AJ Accounting &amp; Tax combines local accessibility with professional accounting and tax experience for businesses and individuals across the East Rand.</p>'''}
          }

          for filename, data in pages.items():
              p=Path(filename)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<title>.*?</title>', '<title>'+data['title']+' | AJ Accounting &amp; Tax</title>', s, count=1, flags=re.S)
              s=re.sub(r'<meta name="description"\s+content=".*?">', '<meta name="description" content="'+data['description']+'">', s, count=1, flags=re.S)
              s=re.sub(r'(<div class="content-card">).*?(<div class="page-cta">)', lambda m:m.group(1)+data['body']+m.group(2), s, count=1, flags=re.S)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services industries areas
          git diff --cached --quiet || git commit -m "Add useful SEO content to service industry and area pages"
          git push
