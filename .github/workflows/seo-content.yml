          'body':'''<h2>VAT Services for South African Businesses</h2>
          <p>Value-added tax affects pricing, cash flow, record keeping and the way a business deals with SARS. Getting VAT right requires more than submitting a return on time: the underlying records and transactions need to support the figures being declared.</p>
          <p>AJ Accounting &amp; Tax assists businesses with VAT administration and ongoing compliance, providing practical support to owners who want their VAT obligations handled accurately and professionally.</p>
          <h2 style="margin-top:30px">VAT registration and administration</h2>
