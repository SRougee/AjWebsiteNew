name: Site navigation and contact fix
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('css/style.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace("url('./Images/heroBackGround.avif')", "url('../Images/heroBackGround.avif')")
          c += r'''

          /* Reliable dropdown navigation */
          .nav-dropdown{position:relative;display:flex;align-items:center;height:100%}
          .nav-dropdown-toggle{display:flex;align-items:center;gap:6px}
          .nav-dropdown-toggle span{font-size:.7rem;transition:transform .2s ease}
          .nav-dropdown:hover .nav-dropdown-toggle span,.nav-dropdown:focus-within .nav-dropdown-toggle span{transform:rotate(180deg)}
          .nav-dropdown-menu{position:absolute;top:100%;left:50%;transform:translate(-50%,8px);min-width:245px;padding:10px;background:var(--white);border:1px solid rgba(20,44,122,.08);border-radius:12px;box-shadow:var(--shadow-md);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s ease,transform .18s ease,visibility .18s ease;z-index:1100}
          .nav-dropdown-menu::before{content:'';position:absolute;left:0;right:0;top:-12px;height:12px}
          .nav-dropdown:hover .nav-dropdown-menu,.nav-dropdown:focus-within .nav-dropdown-menu{opacity:1;visibility:visible;pointer-events:auto;transform:translate(-50%,0)}
          .nav-dropdown-menu a{display:block!important;padding:10px 12px;border-radius:8px;font-size:.88rem!important;font-weight:600!important;white-space:nowrap}
          .nav-dropdown-menu a:hover,.nav-dropdown-menu a:focus{background:var(--grey-050);color:var(--navy)}
          .mobile-menu .mobile-section-label{color:rgba(255,255,255,.62);font-family:var(--font-body);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:18px 0 4px;border-bottom:0}
          .mobile-menu nav a.mobile-sub{font-family:var(--font-body);font-size:1.02rem;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
          @media(max-width:799px){.nav-links,.nav-cta{display:none!important}.nav-inner{padding:10px 18px}.mobile-menu{overflow-y:auto}.mobile-menu nav{margin-top:28px}}
          @media(min-width:800px){.hamburger{display:none}}
          '''
          css.write_text(c,encoding='utf-8')

          desktop = '''<nav class="nav-links"><a href="{home}#about">About</a><div class="nav-dropdown"><a href="{home}#services" class="nav-dropdown-toggle">Services <span>▾</span></a><div class="nav-dropdown-menu"><a href="{home}services/personal-tax.html">Personal Tax</a><a href="{home}services/business-accounting.html">Business Accounting</a><a href="{home}services/vat.html">VAT</a><a href="{home}services/payroll.html">Payroll</a><a href="{home}services/sars-disputes.html">SARS Queries &amp; Disputes</a><a href="{home}services/financial-statements.html">Financial Statements</a><a href="{home}services/cipc-services.html">CIPC &amp; Tax Clearance</a></div></div><div class="nav-dropdown"><a href="{home}#industries" class="nav-dropdown-toggle">Industries <span>▾</span></a><div class="nav-dropdown-menu"><a href="{home}industries/restaurants-hospitality.html">Restaurants &amp; Hospitality</a><a href="{home}industries/manufacturing.html">Manufacturing</a><a href="{home}industries/precious-metals.html">Gold Vendors &amp; Precious Metals</a><a href="{home}industries/trailer-manufacturing.html">Trailer Manufacturing</a><a href="{home}industries/small-business.html">Small &amp; Medium Businesses</a><a href="{home}industries/individuals-families.html">Individuals &amp; Families</a></div></div><a href="{home}#alwin">Meet Alwin</a><a href="{home}#testimonials">Reviews</a><a href="{home}#contact">Contact</a></nav>'''

          mobile = '''<nav><a href="{home}#about">About</a><a href="{home}#services">Services</a><a href="{home}#industries">Industries</a><a href="{home}#alwin">Meet Alwin</a><a href="{home}#testimonials">Reviews</a><a href="{home}#contact">Contact</a><div class="mobile-section-label">Services</div><a class="mobile-sub" href="{home}services/personal-tax.html">Personal Tax</a><a class="mobile-sub" href="{home}services/business-accounting.html">Business Accounting</a><a class="mobile-sub" href="{home}services/vat.html">VAT</a><a class="mobile-sub" href="{home}services/payroll.html">Payroll</a><a class="mobile-sub" href="{home}services/sars-disputes.html">SARS Queries &amp; Disputes</a><a class="mobile-sub" href="{home}services/financial-statements.html">Financial Statements</a><a class="mobile-sub" href="{home}services/cipc-services.html">CIPC &amp; Tax Clearance</a><div class="mobile-section-label">Industries</div><a class="mobile-sub" href="{home}industries/restaurants-hospitality.html">Restaurants &amp; Hospitality</a><a class="mobile-sub" href="{home}industries/manufacturing.html">Manufacturing</a><a class="mobile-sub" href="{home}industries/precious-metals.html">Gold Vendors &amp; Precious Metals</a><a class="mobile-sub" href="{home}industries/trailer-manufacturing.html">Trailer Manufacturing</a><a class="mobile-sub" href="{home}industries/small-business.html">Small &amp; Medium Businesses</a><a class="mobile-sub" href="{home}industries/individuals-families.html">Individuals &amp; Families</a></nav>'''

          # Homepage
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<nav class="nav-links">.*?</nav>', desktop.format(home='./'), s, count=1, flags=re.S)
          s = re.sub(r'<nav>.*?</nav>', mobile.format(home='./'), s, count=1, flags=re.S)
          s = s.replace('href="mailto:aij.jennings@gmail.com"', 'href="#contact"')
          p.write_text(s,encoding='utf-8')

          # Interior pages
          for p in list(Path('services').glob('*.html')) + list(Path('industries').glob('*.html')) + list(Path('areas').glob('*.html')) + [Path('sitemap.html')]:
              s = p.read_text(encoding='utf-8')
              home = './' if p.name == 'sitemap.html' else '../'
              s = re.sub(r'<nav class="nav-links">.*?</nav>', desktop.format(home=home), s, count=1, flags=re.S)
              s = s.replace('<li><a href="mailto:aij.jennings@gmail.com">aij.jennings@gmail.com</a></li>', '<li>aij.jennings@gmail.com</li>')
              s = s.replace('../personal-tax.html', '../services/personal-tax.html').replace('../business-accounting.html', '../services/business-accounting.html').replace('../vat.html', '../services/vat.html').replace('../payroll.html', '../services/payroll.html')
              for x in ['restaurants-hospitality','manufacturing','precious-metals','trailer-manufacturing','small-business','individuals-families']:
                  s = s.replace(f'href="../{x}.html"', f'href="../industries/{x}.html"')
              for x in ['germiston','boksburg','benoni','east-rand']:
                  s = s.replace(f'href="../{x}.html"', f'href="../areas/{x}.html"')
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Fix homepage navigation and dropdown hover"
          git push
