name: Site navigation and mobile layout fix
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Build expanded AJ Accounting site"]
    types: [completed]

jobs:
  fix:
    if: >-
      (github.event_name == 'push' && github.actor != 'github-actions[bot]') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fix mobile navigation, layout and header alignment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('css/style.css')
          c = css.read_text(encoding='utf-8')
          c += r'''

          /* Mobile interior page polish */
          @media(max-width:799px){
            .container,.hero-inner{width:100%;max-width:100%;padding-left:18px;padding-right:18px}
            .py{padding:58px 0}
            .content-grid{width:100%;grid-template-columns:minmax(0,1fr);gap:24px}
            .content-card{width:100%;max-width:100%;padding:22px 20px;border-radius:16px;overflow:hidden}
            .content-card h2{font-size:1.7rem}
            .content-card p,.content-card li{font-size:.94rem;line-height:1.65}
            .page-hero{padding:76px 0 58px}
            .page-hero h1{font-size:clamp(2.15rem,11vw,3.2rem);overflow-wrap:anywhere}
            .page-hero p{font-size:1rem;line-height:1.6}
            .breadcrumbs{margin-bottom:18px}
            .page-cta{padding:28px 22px;margin-top:32px}
            .page-cta h2{font-size:1.65rem}
            .mobile-menu nav{gap:0}
            .mobile-menu nav > a:not(.mobile-sub){font-size:1.45rem;padding:12px 0}
            .mobile-menu details{border-bottom:1px solid rgba(255,255,255,.12)}
            .mobile-menu details summary{list-style:none;color:var(--white);font-family:var(--font-head);font-size:1.45rem;font-weight:600;padding:12px 0;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
            .mobile-menu details summary::-webkit-details-marker{display:none}
            .mobile-menu details summary::after{content:'+';font-family:var(--font-body);font-size:1.35rem;font-weight:400;transition:transform .2s ease}
            .mobile-menu details[open] summary::after{content:'−'}
            .mobile-menu nav a.mobile-sub{display:block;font-family:var(--font-body);font-size:.98rem;padding:9px 0 9px 14px;border-bottom:0;color:rgba(255,255,255,.86)}

            /* Keep the mobile hamburger beside the AJ Accounting & Tax name */
            .site-nav .nav-inner{position:relative;min-height:66px}
            .site-nav .nav-inner > .logo{flex:1;min-width:0}
            .site-nav .nav-inner > .hamburger{display:flex;margin-left:auto;flex:0 0 auto;align-items:center;justify-content:center}
          }
          '''
          css.write_text(c,encoding='utf-8')

          service_links = [('services/personal-tax.html','Personal Tax'),('services/business-accounting.html','Business Accounting'),('services/vat.html','VAT'),('services/payroll.html','Payroll'),('services/sars-disputes.html','SARS Queries &amp; Disputes'),('services/financial-statements.html','Financial Statements'),('services/cipc-services.html','CIPC &amp; Tax Clearance')]
          industry_links = [('industries/restaurants-hospitality.html','Restaurants &amp; Hospitality'),('industries/manufacturing.html','Manufacturing'),('industries/precious-metals.html','Gold Vendors &amp; Precious Metals'),('industries/trailer-manufacturing.html','Trailer Manufacturing'),('industries/small-business.html','Small &amp; Medium Businesses'),('industries/individuals-families.html','Individuals &amp; Families')]

          def mobile_markup(home):
              services = ''.join(f'<a class="mobile-sub" href="{home}{h}">{l}</a>' for h,l in service_links)
              industries = ''.join(f'<a class="mobile-sub" href="{home}{h}">{l}</a>' for h,l in industry_links)
              return f'''<div class="mobile-menu" id="mobileMenu"><div class="mobile-menu-top"><a href="{home}" class="logo"><span class="mark">AJ</span> AJ Accounting &amp; Tax</a><button class="mobile-menu-close" type="button" aria-label="Close menu">&times;</button></div><nav><a href="{home}about.html">About</a><details><summary>Services</summary>{services}</details><details><summary>Industries</summary>{industries}</details><a href="{home}about.html">Meet Alwin</a><a href="{home}reviews.html">Reviews</a><a href="{home}#contact">Contact</a></nav><a href="{home}#contact" class="btn btn-primary">Book a Free Consultation</a></div>'''

          hamburger = '<button class="hamburger" id="mobileMenuOpen" type="button" aria-label="Open menu" aria-controls="mobileMenu" aria-expanded="false"><span></span><span></span><span></span></button>'
          script = '''<script>(function(){var m=document.getElementById('mobileMenu'),o=document.getElementById('mobileMenuOpen'),x=document.querySelector('.mobile-menu-close');if(!m||!o)return;function openMenu(){m.classList.add('open');o.setAttribute('aria-expanded','true');document.body.style.overflow='hidden'}function closeMenu(){m.classList.remove('open');o.setAttribute('aria-expanded','false');document.body.style.overflow=''}o.addEventListener('click',openMenu);if(x)x.addEventListener('click',closeMenu);m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){if(a.getAttribute('href')&&a.getAttribute('href').charAt(0)==='#')closeMenu()})})})();</script>'''

          def fix_page(p, home):
              s=p.read_text(encoding='utf-8')

              # Ensure the hamburger is inside .nav-inner, immediately after the logo,
              # so it sits on the same row as the AJ Accounting & Tax name.
              outside = re.search(r'</header>\s*(<button class="hamburger" id="mobileMenuOpen"[^>]*>.*?</button>)', s, flags=re.S)
              if outside:
                  btn = outside.group(1)
                  s = s.replace(btn, '', 1)
                  nav_inner = re.search(r'(<div class="nav-inner">\s*<a[^>]*class="logo".*?</a>)(.*?)(</div>\s*</header>)', s, flags=re.S)
                  if nav_inner:
                      s = s[:nav_inner.start()] + nav_inner.group(1) + btn + nav_inner.group(2) + nav_inner.group(3) + s[nav_inner.end():]

              # If the hamburger is missing, add it after the desktop logo.
              if 'id="mobileMenuOpen"' not in s:
                  s = re.sub(r'(<div class="nav-inner">\s*<a[^>]*class="logo".*?</a>)', r'\1'+hamburger, s, count=1, flags=re.S)

              # Keep one clean mobile menu and one menu script.
              mm = re.search(r'<div class="mobile-menu" id="mobileMenu">.*?</div><main>', s, flags=re.S)
              if mm:
                  s = s[:mm.start()] + mobile_markup(home) + '<main>' + s[mm.end():]
              if '</body>' in s:
                  s = re.sub(r'<script>\(function\(\)\{var m=document\.getElementById\(\'mobileMenu\'\).*?</script>', '', s, flags=re.S)
                  s = s.replace('</body>', script+'</body>', 1)

              p.write_text(s,encoding='utf-8')

          for folder in ['services','industries','areas']:
              for p in Path(folder).glob('*.html'):
                  fix_page(p, '../')

          fix_page(Path('index.html'), './')
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Align mobile hamburger with site logo"
          git push
