name: Site navigation and mobile layout fix
on:
  push:
    branches: [main]
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix mobile navigation and layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css = Path('css/style.css')
          c = css.read_text(encoding='utf-8')
          c += r'''

          /* Mobile interior page polish */
          @media(max-width:799px){
            .container,.hero-inner{width:100%;max-width:100%;padding-left:18px;padding-right:18px}
            .py{padding:58px 0}
            .content-grid{width:100%;grid-template-columns:minmax(0,1fr);gap:24px}
            .content-card{width:100%;max-width:100%;padding:22px 20px;border-radius:16px;overflow:hidden}
            .content-card h2{font-size:1.7rem}
            .content-card p,.content-card li{font-size:.94rem;line-height:1.65}
            .page-hero{padding:76px 0 58px}
            .page-hero h1{font-size:clamp(2.15rem,11vw,3.2rem);overflow-wrap:anywhere}
            .page-hero p{font-size:1rem;line-height:1.6}
            .breadcrumbs{margin-bottom:18px}
            .page-cta{padding:28px 22px;margin-top:32px}
            .page-cta h2{font-size:1.65rem}
            .mobile-menu nav{gap:0}
            .mobile-menu nav > a:not(.mobile-sub){font-size:1.45rem;padding:12px 0}
            .mobile-menu details{border-bottom:1px solid rgba(255,255,255,.12)}
            .mobile-menu details summary{list-style:none;color:var(--white);font-family:var(--font-head);font-size:1.45rem;font-weight:600;padding:12px 0;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
            .mobile-menu details summary::-webkit-details-marker{display:none}
            .mobile-menu details summary::after{content:'+';font-family:var(--font-body);font-size:1.35rem;font-weight:400;transition:transform .2s ease}
            .mobile-menu details[open] summary::after{content:'−'}
            .mobile-menu nav a.mobile-sub{display:block;font-family:var(--font-body);font-size:.98rem;padding:9px 0 9px 14px;border-bottom:0;color:rgba(255,255,255,.86)}
          }
          '''
          css.write_text(c,encoding='utf-8')

          service_links = [('services/personal-tax.html','Personal Tax'),('services/business-accounting.html','Business Accounting'),('services/vat.html','VAT'),('services/payroll.html','Payroll'),('services/sars-disputes.html','SARS Queries &amp; Disputes'),('services/financial-statements.html','Financial Statements'),('services/cipc-services.html','CIPC &amp; Tax Clearance')]
          industry_links = [('industries/restaurants-hospitality.html','Restaurants &amp; Hospitality'),('industries/manufacturing.html','Manufacturing'),('industries/precious-metals.html','Gold Vendors &amp; Precious Metals'),('industries/trailer-manufacturing.html','Trailer Manufacturing'),('industries/small-business.html','Small &amp; Medium Businesses'),('industries/individuals-families.html','Individuals &amp; Families')]

          def mobile_markup(home):
              services = ''.join(f'<a class="mobile-sub" href="{home}{h}">{l}</a>' for h,l in service_links)
              industries = ''.join(f'<a class="mobile-sub" href="{home}{h}">{l}</a>' for h,l in industry_links)
              return f'''<div class="mobile-menu" id="mobileMenu"><div class="mobile-menu-top"><a href="{home}" class="logo"><span class="mark">AJ</span> AJ Accounting &amp; Tax</a><button class="mobile-menu-close" type="button" aria-label="Close menu">&times;</button></div><nav><a href="{home}#about">About</a><details><summary>Services</summary>{services}</details><details><summary>Industries</summary>{industries}</details><a href="{home}#alwin">Meet Alwin</a><a href="{home}#testimonials">Reviews</a><a href="{home}#contact">Contact</a></nav><a href="{home}#contact" class="btn btn-primary">Book a Free Consultation</a></div>'''

          def hamburger():
              return '<button class="hamburger" id="mobileMenuOpen" type="button" aria-label="Open menu" aria-controls="mobileMenu" aria-expanded="false"><span></span><span></span><span></span></button>'

          script = '''<script>(function(){var m=document.getElementById('mobileMenu'),o=document.getElementById('mobileMenuOpen'),x=document.querySelector('.mobile-menu-close');if(!m||!o)return;function open(){m.classList.add('open');o.setAttribute('aria-expanded','true');document.body.style.overflow='hidden'}function close(){m.classList.remove('open');o.setAttribute('aria-expanded','false');document.body.style.overflow=''}o.addEventListener('click',open);if(x)x.addEventListener('click',close);m.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){if(a.getAttribute('href')&&a.getAttribute('href').charAt(0)==='#')close()})})})();</script>'''

          for folder in ['services','industries','areas']:
              for p in Path(folder).glob('*.html'):
                  s=p.read_text(encoding='utf-8')
                  home='../'
                  s=re.sub(r'<div class="mobile-menu" id="mobileMenu">.*?</div><main>', mobile_markup(home)+'<main>', s, count=1, flags=re.S)
                  if 'id="mobileMenuOpen"' not in s:
                      s=s.replace('</nav><a href="../#contact" class="btn btn-navy nav-cta">', '</nav>'+hamburger()+'<a href="../#contact" class="btn btn-navy nav-cta">', 1)
                  if '</body>' in s and 'function open(){m.classList.add' not in s:
                      s=s.replace('</body>',script+'</body>',1)
                  p.write_text(s,encoding='utf-8')

          # Also make the homepage mobile navigation use the same expandable sections.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '<div class="mobile-menu" id="mobileMenu">' in s:
              s=re.sub(r'<div class="mobile-menu" id="mobileMenu">.*?</div><main>', mobile_markup('./')+'<main>', s, count=1, flags=re.S)
          if 'id="mobileMenuOpen"' not in s:
              s=s.replace('</nav><a href="./#contact" class="btn btn-navy nav-cta">', '</nav>'+hamburger()+'<a href="./#contact" class="btn btn-navy nav-cta">', 1)
          if '</body>' in s and 'function open(){m.classList.add' not in s:
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Fix mobile menu and interior page layout"
          git push
